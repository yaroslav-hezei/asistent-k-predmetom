name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "data/mais/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/mais/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # local Postgres started below with all migrations applied (default local credentials)
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local Postgres and apply the migrations
        working-directory: .
        run: |
          supabase db start
          supabase db push
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: openapi.json is up to date
        run: python scripts/export_openapi.py --check
